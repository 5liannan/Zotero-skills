name: storage-skill-ci

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/storage-ci.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/storage-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile scripts/manage_zotero_storage.py
          python -m py_compile scripts/docx_quality.py
          python -m py_compile scripts/migrate_zotero_datadir.py
          python -m py_compile tests/test_storage_quality.py

      - name: CLI help smoke test (no args should still parse)
        run: |
          python scripts/manage_zotero_storage.py --help
          python scripts/docx_quality.py --help

      - name: Quality audit regression test
        run: python tests/test_storage_quality.py
