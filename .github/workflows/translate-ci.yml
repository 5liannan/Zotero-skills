name: translate-skill-ci

on:
  push:
    paths:
      - "skills/translate-import/**"
      - ".github/workflows/translate-ci.yml"
  pull_request:
    paths:
      - "skills/translate-import/**"
      - ".github/workflows/translate-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: skills/translate-import
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc
          pandoc --version | head -1

      - name: Syntax check scripts
        run: |
          python -m py_compile scripts/translate_config.py
          python -m py_compile scripts/extract_pdf_text.py
          python -m py_compile scripts/omml.py
          python -m py_compile scripts/finalize.py
          python -m py_compile scripts/build_docx.py
          python -m py_compile scripts/verify_docx.py
          python -m py_compile scripts/register_zotero_docx.py
          python -m py_compile scripts/fix_zotero_titles.py
          python -m py_compile scripts/full_v3_pipeline.py
          python -m py_compile tests/test_pipeline.py

      - name: Config loader smoke test
        run: |
          export ZOTERO_DATA_DIR=/tmp/zotero
          export ZOTERO_WORK_BASE=/tmp/zwork
          python scripts/translate_config.py

      - name: Build sample DOCX (build = final deliverable)
        run: |
          python scripts/build_docx.py examples/parts /tmp/sample_out.docx
          python scripts/verify_docx.py /tmp/sample_out.docx

      - name: Assert the build output is already a final deliverable
        run: |
          python - <<'PY'
          import json, subprocess, sys
          out = subprocess.run(
              [sys.executable, "scripts/verify_docx.py", "/tmp/sample_out.docx"],
              capture_output=True, text=True, check=True).stdout
          st = json.loads(out)
          print("verify:", st)
          assert st["ok"], "verify_docx returned ok=false"
          # --- 公式必须是 Word 原生公式对象 ---
          assert st["omath"] > 0, "no OMML formula objects produced"
          assert st["raw_dollar"] == 0, "unconverted $ delimiters remain"
          assert st["raw_latex"] == 0, "unconverted LaTeX commands remain"
          # --- 终稿规范项 ---
          assert st["header"], "header is empty"
          assert st["footer_page"], "footer has no PAGE field"
          assert st["xref"] > 0, "no clickable in-text citations"
          assert st["bookmarks"] == st["refs"], (
              "bookmark count %s != reference count %s" % (st["bookmarks"], st["refs"]))
          assert not st["ref_errors"], "reference consistency: %s" % st["ref_errors"]
          assert not st["dangling"] and not st["unused"], "dangling/unused citations"
          print("PASS: %d OMML, %d refs, %d links, header+page OK"
                % (st["omath"], st["refs"], st["xref"]))
          PY

      - name: Assert broken builds are refused (no silent degradation)
        run: python tests/test_pipeline.py

      - name: Upload sample artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: sample-docx
          path: /tmp/sample_out.docx
          if-no-files-found: ignore



